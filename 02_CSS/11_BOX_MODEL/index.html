<!-- 2. Box Model
What is it?
The Box Model represents how elements are displayed in the browser. It consists of:

Content (Text or images inside an element)
Padding (Space around the content)
Border (A line surrounding the padding)
Margin (Space outside the border)
Why is it important?

Helps in layout design.
Affects spacing between elements. -->
