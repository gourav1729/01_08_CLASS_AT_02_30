1. Alpha & Opacity
Alpha: In RGBA, controls transparency in colors (e.g., rgba(r, g, b, alpha)).
Opacity: Controls the transparency of an element (opacity: 0.5 means 50% transparent).
Difference: Opacity affects the entire element including its children, while alpha only affects the color.
-->
